[project]
name = "onair-api"
version = "1.0.0"
description = "Podcast search for the On Air apps, backed by the Podcast Index API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
